name: 🔍 Large Repo Analysis (Chunked)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Large Repository
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Increased for multiple API calls
    # Optional analysis: never block required checks if the secret is missing
    # or the upstream API fails.
    continue-on-error: true

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check whether secret exists
        id: secret
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        # Non-fatal: emit an output and skip the run when the key is absent,
        # instead of failing every push/PR (continue-on-error already set).
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "NVIDIA_API_KEY is not set; downstream steps will be skipped."
          else
            echo "NVIDIA_API_KEY is set (length: ${#NVIDIA_API_KEY})."
          fi
          echo "has_key=$([ -n "$NVIDIA_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        if: steps.secret.outputs.has_key == 'true'
        run: pip install openai

      - name: Run Chunked Repo Analysis
        if: steps.secret.outputs.has_key == 'true'
        id: analysis
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python .github/scripts/analyze_repo_large.py ${{ github.workspace }}

      - name: Upload Analysis Report
        if: steps.secret.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: large-repo-analysis-report
          path: repo_analysis.md
          retention-days: 30

      - name: Post Analysis as PR Comment
        if: github.event_name == 'pull_request' && steps.secret.outputs.has_key == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = fs.readFileSync('repo_analysis.md', 'utf8');
            
            const maxLength = 65000;
            const body = analysis.length > maxLength
              ? analysis.substring(0, maxLength) + "\n\n⚠️ *Report truncated. Download full artifact.*"
              : analysis;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 GLM-5.2 Large Repo Analysis\n\n${body}`
            });

      - name: Create Issue with Analysis
        if: github.event_name == 'push' && steps.secret.outputs.has_key == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = fs.readFileSync('repo_analysis.md', 'utf8');
            
            const maxLength = 65000;
            const body = analysis.length > maxLength
              ? analysis.substring(0, maxLength) + "\n\n⚠️ *Report truncated. Download artifact for full report.*"
              : analysis;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔍 Large Repo Analysis - ${new Date().toISOString().split('T')[0]}`,
              body: `## 🤖 GLM-5.2 Full Repository Analysis\n\n${body}`,
              labels: ['analysis', 'automated']
            });
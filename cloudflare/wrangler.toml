# OPTIONAL: only for the Fly.io/Vercel/Cloudflare deployment (docs/DEPLOYMENT_OPTION_A.md).
# The active deployment is Azure Container Apps, which needs no Worker.
# BACKEND_ORIGIN below is a placeholder. If this Worker proxies to the app, set
# TRUSTED_PROXY_COUNT=2 on the backend so rate limiting sees the real client IP.

name = "chattamai"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Environment variables configured on Cloudflare Worker
[vars]
BACKEND_ORIGIN = "https://your-backend-app.fly.dev"
ALLOWED_ORIGINS = "https://chattamai.vercel.app,http://localhost:5173"

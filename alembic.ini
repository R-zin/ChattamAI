# Alembic configuration for ChattamAI.
#
# ``sqlalchemy.url`` is intentionally left blank: it is resolved at runtime from
# the application's own engine URL (``app.services.database.DATABASE_URL``, i.e.
# the DATABASE_URL env var) inside ``alembic/env.py``. This keeps the DSN in one
# place and lets tests point at a throwaway sqlite file simply by setting
# DATABASE_URL before running ``alembic upgrade head``.

[alembic]
# Path to migration scripts (relative to this ini file).
script_location = alembic

# Template used to name new revision files.
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps (UTC).
timezone = UTC

# Source URL is provided by alembic/env.py from the app engine; leave empty here.
sqlalchemy.url =

# Mark a section of the migration path as a path separator for split upgrades.
; revision_environment = false


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

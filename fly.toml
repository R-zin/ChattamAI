# Fly.io deployment configuration for ChattamAI Backend
# Preserves FAISS vector store and SQLite database via a persistent volume at /app/data.

app = "chattamai-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DATABASE_URL = "sqlite:////app/data/chattamai.db"
  KBR_DATA_DIR = "/app/data/kbr"
  INDEX_DIR = "/app/data/index"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "chattam_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

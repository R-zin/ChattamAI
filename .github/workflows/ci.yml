name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch / ref to conserve runner minutes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff==0.14.5

      - name: Ruff Lint Check
        run: ruff check --output-format=github .

      - name: Ruff Format Check
        run: ruff format --check .

  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Tesseract OCR & GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Offline Test Suite with Coverage
        env:
          OPENAI_API_KEY: ""
          NVIDIA_API_KEY: ""
          NIM_API_KEY: ""
          ANTHROPIC_AUTH_TOKEN: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: |
          coverage run --source=app -m pytest -q -m "not live_nvidia"
          coverage report --show-missing --fail-under=60
          coverage xml

      - name: Upload Coverage Report Artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  nvidia-vision-verify:
    name: Live NVIDIA Nemotron-VL Blueprint Parsing
    runs-on: ubuntu-latest
    needs: [backend-tests]
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.NIM_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies (PyMuPDF / GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check NVIDIA_API_KEY Secret
        id: check_secret
        run: |
          if [ -n "$NVIDIA_API_KEY" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
            echo "NVIDIA_API_KEY secret detected. Proceeding with live Nemotron-VL verification."
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NVIDIA_API_KEY secret is not configured in repository secrets. Skipping live NIM verification."
          fi

      - name: Run Live Nemotron-VL Vision Blueprint Parsing & NIM Tests
        if: steps.check_secret.outputs.has_secret == 'true'
        run: |
          pytest -m live_nvidia -v

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test -- --run

      - name: Run Production Vite Build
        run: npm run build

  smoke-test:
    name: FastAPI Server Boot & Health Smoke
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies (PyMuPDF / GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Boot Server and Verify /api/health
        env:
          OPENAI_API_KEY: ""
          NVIDIA_API_KEY: ""
          ANTHROPIC_AUTH_TOKEN: ""
          GEMINI_API_KEY: ""
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl --fail -s http://127.0.0.1:8000/ > /dev/null; then
              echo "Server responded on attempt $i."
              break
            fi
            sleep 1
          done

          fail() { echo "::error::$1"; kill $SERVER_PID; exit 1; }

          # Liveness never depends on credentials.
          curl --fail -s http://127.0.0.1:8000/api/health/live > /dev/null \
            || fail "/api/health/live must return 200"

          # With no credentials the app must boot AND say honestly that it is
          # not ready: 200 from /api/health but status degraded with reasons,
          # and 503 from /api/health/ready.
          HEALTH_RESP=$(curl --fail -s http://127.0.0.1:8000/api/health) \
            || fail "/api/health must return 200"
          echo "Health response: $HEALTH_RESP"
          [ "$(echo "$HEALTH_RESP" | jq -r .status)" = "degraded" ] \
            || fail "credential-less boot must report status=degraded"
          [ "$(echo "$HEALTH_RESP" | jq '.issues | length')" -gt 0 ] \
            || fail "degraded health must explain why (issues)"
          READY_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/health/ready)
          [ "$READY_CODE" = "503" ] || fail "/api/health/ready must be 503 when not ready (got $READY_CODE)"

          # Unknown API paths are a JSON 404, not the SPA shell.
          NOPE_CODE=$(curl -s -o /tmp/nope.json -w "%{http_code}" -H "Accept: text/html" http://127.0.0.1:8000/api/does-not-exist)
          [ "$NOPE_CODE" = "404" ] && jq -e .detail /tmp/nope.json > /dev/null \
            || fail "unknown /api path must be a JSON 404 (got $NOPE_CODE)"

          kill $SERVER_PID

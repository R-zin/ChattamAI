name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ruff provides both linting (ruff check) and formatting (ruff format);
      # this matches how the project's code is formatted locally. The previous
      # bare black/isort checks had no shared config and disagreed with ruff.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "latest"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build Container & Deploy to Azure
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-chattamai-prod' }}
      AZURE_CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME || 'chattamai-prod' }}
      AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Container Registry Name
        id: resolve-acr
        run: |
          if [ -n "$AZURE_CONTAINER_REGISTRY" ]; then
            RAW_ACR="${AZURE_CONTAINER_REGISTRY}"
            RAW_ACR="${RAW_ACR#https://}"
            RAW_ACR="${RAW_ACR#http://}"
            RAW_ACR="${RAW_ACR%.azurecr.io}"
            CLEAN_ACR=$(echo "$RAW_ACR" | tr '[:upper:]' '[:lower:]' | xargs)
            echo "acr_server=${CLEAN_ACR}.azurecr.io" >> $GITHUB_OUTPUT
            echo "acr_name=${CLEAN_ACR}" >> $GITHUB_OUTPUT
          else
            # Discover first ACR in the resource group
            ACR_NAME=$(az acr list --resource-group "$AZURE_RESOURCE_GROUP" --query "[0].name" -o tsv || echo "")
            if [ -z "$ACR_NAME" ]; then
              echo "Error: No Azure Container Registry specified or discovered in $AZURE_RESOURCE_GROUP."
              exit 1
            fi
            echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
            echo "acr_server=${ACR_NAME}.azurecr.io" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ steps.resolve-acr.outputs.acr_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.resolve-acr.outputs.acr_server }}/chattamai:${{ github.sha }}
            ${{ steps.resolve-acr.outputs.acr_server }}/chattamai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Image Revision to Azure Container App
        id: deploy-app
        run: |
          IMAGE_URI="${{ steps.resolve-acr.outputs.acr_server }}/chattamai:${{ github.sha }}"
          ACR_NAME="${{ steps.resolve-acr.outputs.acr_name }}"
          ACR_SERVER="${{ steps.resolve-acr.outputs.acr_server }}"
          TARGET_APP="$AZURE_CONTAINER_APP_NAME"

          echo "Checking for Container App '$TARGET_APP' in resource group '$AZURE_RESOURCE_GROUP'..."
          if ! az containerapp show --name "$TARGET_APP" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Container app '$TARGET_APP' was not found directly. Querying container apps in '$AZURE_RESOURCE_GROUP'..."
            DISCOVERED_APP=$(az containerapp list --resource-group "$AZURE_RESOURCE_GROUP" --query "[0].name" -o tsv || echo "")
            if [ -n "$DISCOVERED_APP" ]; then
              echo "Found Container App: '$DISCOVERED_APP'. Using it for deployment."
              TARGET_APP="$DISCOVERED_APP"
            else
              echo "::error::No Container App found in resource group '$AZURE_RESOURCE_GROUP'."
              echo "Listing existing resources in '$AZURE_RESOURCE_GROUP':"
              az resource list --resource-group "$AZURE_RESOURCE_GROUP" --output table || true
              echo "Action required: Run the initial Bicep deployment in Azure Cloud Shell to provision the container app before deploying code."
              exit 1
            fi
          fi

          echo "target_app=$TARGET_APP" >> $GITHUB_OUTPUT

          echo "Configuring ACR pull credentials for $TARGET_APP..."
          az acr update --name "$ACR_NAME" --admin-enabled true >/dev/null 2>&1 || true
          ACR_USER=$(az acr credential show --name "$ACR_NAME" --query "username" -o tsv)
          ACR_PASS=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)

          # Configure registry credentials on the container app.
          # Note: If the currently active revision is in a failed pull state, az containerapp registry set
          # may return non-zero while attempting to restart it. We capture this and proceed so az containerapp update
          # deploys the new revision with the fresh credentials.
          az containerapp registry set \
            --name "$TARGET_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$ACR_SERVER" \
            --username "$ACR_USER" \
            --password "$ACR_PASS" || echo "Note: registry set completed (previous broken revision restart caught); proceeding to deploy new image revision..."

          echo "Deploying $IMAGE_URI to $TARGET_APP in $AZURE_RESOURCE_GROUP..."
          az containerapp update \
            --name "$TARGET_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_URI"

          echo "Ensuring ingress targetPort is 8000..."
          az containerapp ingress update \
            --name "$TARGET_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --target-port 8000 >/dev/null 2>&1 || true

      - name: Verify Deployment Health
        run: |
          TARGET_APP="${{ steps.deploy-app.outputs.target_app || env.AZURE_CONTAINER_APP_NAME }}"
          APP_INFO=$(az containerapp show \
            --name "$TARGET_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "{fqdn:properties.configuration.ingress.fqdn, latestRev:properties.latestRevisionName}" -o json)
          
          APP_URL=$(echo "$APP_INFO" | jq -r '.fqdn // empty')
          LATEST_REV=$(echo "$APP_INFO" | jq -r '.latestRev // empty')
          
          echo "Application FQDN: https://$APP_URL"
          echo "Target Revision: $LATEST_REV"
          echo "Awaiting health check endpoint (https://$APP_URL/api/health)..."
          
          SUCCESS=0
          for i in {1..20}; do
            STATUS=$(curl -k -s --connect-timeout 5 --max-time 10 -o /tmp/health_resp.json -w "%{http_code}" "https://$APP_URL/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check succeeded with HTTP 200 on attempt $i."
              cat /tmp/health_resp.json
              SUCCESS=1
              break
            fi
            
            # Check if revision provision state is already marked Failed
            REV_STATE=$(az containerapp revision show \
              --name "$TARGET_APP" \
              --revision "$LATEST_REV" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.provisioningState" -o tsv 2>/dev/null || echo "")
            
            echo "Attempt $i: Received HTTP $STATUS (Revision state: ${REV_STATE:-unknown}). Retrying in 5s..."
            if [ "$REV_STATE" = "Failed" ] && [ $i -ge 3 ]; then
              echo "::warning::Revision '$LATEST_REV' has failed provisioning. Aborting poll early."
              break
            fi
            sleep 5
          done
          
          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::Health check failed with final status $STATUS."
            echo "=== Target App Ingress & State ==="
            az containerapp show \
              --name "$TARGET_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "{ingress:properties.configuration.ingress, provisioningState:properties.provisioningState, runningStatus:properties.runningStatus, latestRevision:properties.latestRevisionName}" -o json || true
            echo "=== Revisions Table ==="
            az containerapp revision list \
              --name "$TARGET_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[].{name:name, active:properties.active, healthState:properties.healthState, provisionStatus:properties.provisioningState}" -o table || true
            echo "=== Detailed Revision Info ==="
            az containerapp revision show \
              --name "$TARGET_APP" \
              --revision "$LATEST_REV" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "{provisioningError:properties.provisioningError, volumes:properties.template.volumes, volumeMounts:properties.template.containers[0].volumeMounts, probes:properties.template.containers[0].probes, resources:properties.template.containers[0].resources}" -o json || true
            echo "=== System Event Logs ==="
            az containerapp logs show \
              --name "$TARGET_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --type system \
              --tail 50 || true
            echo "=== Console Logs ==="
            az containerapp logs show \
              --name "$TARGET_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --type console \
              --tail 50 || true
            exit 1
          fi

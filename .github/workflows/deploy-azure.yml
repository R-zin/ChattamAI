name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build Container & Deploy to Azure
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-chattamai-prod' }}
      AZURE_CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME || 'chattamai-prod' }}
      AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Container Registry Name
        id: resolve-acr
        run: |
          if [ -n "$AZURE_CONTAINER_REGISTRY" ]; then
            echo "acr_server=${AZURE_CONTAINER_REGISTRY}.azurecr.io" >> $GITHUB_OUTPUT
            echo "acr_name=${AZURE_CONTAINER_REGISTRY}" >> $GITHUB_OUTPUT
          else
            # Discover first ACR in the resource group
            ACR_NAME=$(az acr list --resource-group "$AZURE_RESOURCE_GROUP" --query "[0].name" -o tsv || echo "")
            if [ -z "$ACR_NAME" ]; then
              echo "Error: No Azure Container Registry specified or discovered in $AZURE_RESOURCE_GROUP."
              exit 1
            fi
            echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
            echo "acr_server=${ACR_NAME}.azurecr.io" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ steps.resolve-acr.outputs.acr_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.resolve-acr.outputs.acr_server }}/chattamai:${{ github.sha }}
            ${{ steps.resolve-acr.outputs.acr_server }}/chattamai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Image Revision to Azure Container App
        run: |
          IMAGE_URI="${{ steps.resolve-acr.outputs.acr_server }}/chattamai:${{ github.sha }}"
          echo "Deploying $IMAGE_URI to $AZURE_CONTAINER_APP_NAME in $AZURE_RESOURCE_GROUP..."
          
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_URI"

      - name: Verify Deployment Health
        run: |
          APP_URL=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          
          echo "Application FQDN: https://$APP_URL"
          echo "Awaiting health check endpoint (https://$APP_URL/api/health)..."
          
          for i in {1..30}; do
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "https://$APP_URL/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check succeeded with HTTP 200 on attempt $i."
              curl -k -s "https://$APP_URL/api/health"
              exit 0
            fi
            echo "Attempt $i: Received HTTP $STATUS. Retrying in 5s..."
            sleep 5
          done
          
          echo "Error: Health check timed out or failed."
          exit 1
